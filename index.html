<html>
  <head>
    <title>Pulsus Skills Web</title>
    <link rel="stylesheet" href="https:/xnebular881.github.io/Pulsus Skills Web/style.css">
  </head>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #0e0e0f;
        }

        .container {
            border: 1px solid grey;
            margin: 1rem;
        }

        [data-tab-info] {
            display: none;
        }

        .active[data-tab-info] {
            display: block;
        }

        .tab-content {
            margin-top: 1rem;
            padding-left: 1rem;
            font-size: 20px;
            @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap');
            font-weight: bold;
            color: rgb(0, 0, 0);
        }

        .tabs {
            border-bottom: 1px solid grey;
            background-color: white;
            font-size: 25px;
            color: rgb(0, 0, 0);
            display: flex;
            margin: 0;
        }

        .tabs span {
            background: rgb(16, 153, 9);
            padding: 10px;
            border: 1px solid rgb(255, 255, 255);
        }

        .tabs span:hover {
            background: rgb(55, 219, 46);
            cursor: pointer;
            color: black;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="tabs">
            <span data-tab-value="#Home">Home</span>
            <span data-tab-value="#Search">Search</span>
            <span data-tab-value="#Packs">Map Packs</span>
            <span data-tab-value="#Rundown">Monthly Awarded Map Rundown</span>
        </div>

        <!-- Tab content -->
        <div class="tab-content">
            <div class="tabs__tab active" id="#Home" data-tab-info>
                <p>
                  <body>
                    <h1><center>Welcome to the Pulsus Skills Web!</center></h1>
                    <h2><center>The primary resource for awarded and unawarded maps.</center>
                     <img src="pulsus difficulties/specialRanked.png"/>
                    </h2>
                    
                </p>

            </div>
            <div class="tabs__tab" id="Search" data-tab-info>
                <p>Davos, we are here!</p>
            </div>
            <div class="tabs__tab" id="Packs" data-tab-info>
                <p>Ze agenda is quite clear!</p>
            </div>
            <div class="tabs__tab" id="Rundown" data-tab-info>
                <p>A breakdown of the maps awarded each month.</p>
          
        </div>
    </div>
    <script type="text/javascript">

        // function to get each tab details
        const tabs = document.querySelectorAll('[data-tab-value]')
        const tabInfos = document.querySelectorAll('[data-tab-info]')

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = document
                    .querySelector(tab.dataset.tabValue);
                tabInfos.forEach(tabInfo => {
                    tabInfo.classList.remove('active')
                })
                target.classList.add('active');
            })
        })
    </script>
</body>
</html>
